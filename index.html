<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1~21號 雲端即時前三名票選系統</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // VdxyiZ5OiyDxf2JTaRX61Ph2BJpcmm1qmUfmhR22
    const firebaseConfig = {
      apiKey: "VdxyiZ5OiyDxf2JTaRX61Ph2BJpcmm1qmUfmhR22",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const ADMIN_PASSWORD = "aa710119";

    function App() {
      const [activeTab, setActiveTab] = React.useState('vote');
      const [candidates, setCandidates] = React.useState([]);
      const [votes, setVotes] = React.useState({});
      const [selectedSeat, setSelectedSeat] = React.useState('');
      const [rankings, setRankings] = React.useState({ first: null, second: null, third: null });
      const [isAdminUnlocked, setIsAdminUnlocked] = React.useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = React.useState('');
      const [toastMessage, setToastMessage] = React.useState('');
      const [newTitle, setNewTitle] = React.useState('');
      const [newDesc, setNewDesc] = React.useState('');
      const [newImgUrl, setNewImgUrl] = React.useState('');

      // 即時監聽 Firebase 資料庫變化
      React.useEffect(() => {
        // 1. 監聽候選項目
        const candidatesRef = db.ref('candidates');
        candidatesRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            setCandidates(list);
          } else {
            setCandidates([]);
          }
        });

        // 2. 監聽所有座號投票紀錄
        const votesRef = db.ref('votes');
        votesRef.on('value', (snapshot) => {
          const data = snapshot.val();
          setVotes(data || {});
        });

        return () => {
          candidatesRef.off();
          votesRef.off();
        };
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // 檢查某個座號是否已經投過票
      const isSeatVoted = (seat) => {
        return !!(votes && votes[`seat_${seat}`]);
      };

      // 選擇名次指派
      const assignRank = (candidateId, rank) => {
        setRankings(prev => {
          const updated = { ...prev };
          Object.keys(updated).forEach(key => {
            if (updated[key] === candidateId) updated[key] = null;
          });
          updated[rank] = candidateId;
          return updated;
        });
      };

      // 送出投票至 Firebase
      const handleSubmitVote = () => {
        if (!selectedSeat) {
          showToast('請先選擇您的座號！');
          return;
        }
        if (isSeatVoted(selectedSeat)) {
          showToast(`座號 ${selectedSeat} 號已經完成過投票，無法重複投！`);
          return;
        }
        if (!rankings.first || !rankings.second || !rankings.third) {
          showToast('請選滿前三名（第一名、第二名、第三名）後再送出！');
          return;
        }

        const newVote = {
          seat: parseInt(selectedSeat),
          first: rankings.first,
          second: rankings.second,
          third: rankings.third,
          timestamp: Date.now()
        };

        db.ref(`votes/seat_${selectedSeat}`).set(newVote, (error) => {
          if (error) {
            showToast('投票失敗，請檢查網路！');
          } else {
            showToast(`🎉 ${selectedSeat} 號投票成功！全班即時看板已同步。`);
            setRankings({ first: null, second: null, third: null });
            setSelectedSeat('');
          }
        });
      };

      // 管理員登入
      const handleAdminLogin = () => {
        if (adminPasswordInput === ADMIN_PASSWORD) {
          setIsAdminUnlocked(true);
          showToast('🔓 管理員解鎖成功！');
        } else {
          showToast('❌ 密碼錯誤！');
        }
      };

      // 一鍵生成 1~21 號候選
      const generate1To21 = () => {
        if (!isAdminUnlocked) return;
        const updates = {};
        for (let i = 1; i <= 21; i++) {
          const id = `item_${i}`;
          updates[id] = {
            title: `${i} 號項目`,
            desc: `這是第 ${i} 號候選項目的說明`,
            imageUrl: `https://placehold.co/400x300/1e293b/38bdf8?text=No.${i}`
          };
        }
        db.ref('candidates').set(updates, (error) => {
          if (!error) showToast('⚡ 已成功在線上資料庫生成 1~21 號候選項目！');
        });
      };

      // 新增候選項目
      const handleAddCandidate = () => {
        if (!newTitle) return showToast('請輸入名稱');
        const newId = 'item_' + Date.now();
        db.ref(`candidates/${newId}`).set({
          title: newTitle,
          desc: newDesc || '暫無說明',
          imageUrl: newImgUrl || 'https://placehold.co/400x300/1e293b/e2e8f0?text=Option'
        }, () => {
          showToast('新增成功！');
          setNewTitle(''); setNewDesc(''); setNewImgUrl('');
        });
      };

      // 刪除單一候選項目
      const handleDeleteCandidate = (id) => {
        if (!isAdminUnlocked) return;
        db.ref(`candidates/${id}`).remove(() => showToast('已刪除候選項目'));
      };

      // 清空所有投票數據
      const handleClearVotes = () => {
        if (!isAdminUnlocked) return;
        db.ref('votes').remove(() => showToast('已清空所有雲端投票紀錄！'));
      };

      // 計算總得分
      const calculateScores = () => {
        const scoreMap = {};
        candidates.forEach(c => { scoreMap[c.id] = { ...c, points: 0, 1st: 0, 2nd: 0, 3rd: 0 }; });

        Object.values(votes).forEach(vote => {
          if (scoreMap[vote.first]) { scoreMap[vote.first].points += 3; scoreMap[vote.first]['1st'] += 1; }
          if (scoreMap[vote.second]) { scoreMap[vote.second].points += 2; scoreMap[vote.second]['2nd'] += 1; }
          if (scoreMap[vote.third]) { scoreMap[vote.third].points += 1; scoreMap[vote.third]['3rd'] += 1; }
        });

        return Object.values(scoreMap).sort((a, b) => b.points - a.points);
      };

      const sortedLeaderboard = calculateScores();
      const totalVotedCount = Object.keys(votes).length;

      return (
        <div class="max-w-5xl mx-auto p-4 pb-20">
          {/* 吐司提示 */}
          {toastMessage && (
            <div class="fixed top-4 right-4 bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 animate-bounce flex items-center gap-2">
              <i class="fa-solid fa-bell"></i> {toastMessage}
            </div>
          )}

          {/* 頁首標題 */}
          <header class="text-center py-6">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
              🏆 雲端即時前三名票選系統 (1~21號)
            </h1>
            <p class="text-slate-400 text-sm mt-2">
              全班即時連線 ‧ 選取座號投票 ‧ 自動加權計分 (🥇3分 / 🥈2分 / 🥉1分)
            </p>
          </header>

          {/* 導覽頁籤 */}
          <div class="flex justify-center gap-3 mb-6">
            <button 
              onClick={() => setActiveTab('vote')}
              class={`px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2 ${activeTab === 'vote' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
              <i class="fa-solid fa-vote-yea"></i> 開始投票
            </button>
            <button 
              onClick={() => setActiveTab('leaderboard')}
              class={`px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2 ${activeTab === 'leaderboard' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
              <i class="fa-solid fa-chart-line"></i> 即時排行榜 ({totalVotedCount}/21)
            </button>
            <button 
              onClick={() => setActiveTab('admin')}
              class={`px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2 ${activeTab === 'admin' ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
              <i class="fa-solid fa-lock"></i> 管理後台 {isAdminUnlocked ? '🔓' : '🔒'}
            </button>
          </div>

          {/* 投票頁面 */}
          {activeTab === 'vote' && (
            <div class="space-y-6">
              {/* 座號選擇卡片 */}
              <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold text-slate-200 mb-3 flex items-center gap-2">
                  <i class="fa-solid fa-id-badge text-blue-400"></i> 請選擇您的座號 (1 ~ 21 號)
                </h2>
                <div class="grid grid-cols-7 sm:grid-cols-11 gap-2">
                  {Array.from({ length: 21 }, (_, i) => i + 1).map(num => {
                    const voted = isSeatVoted(num);
                    const isSelected = selectedSeat === String(num);
                    return (
                      <button
                        key={num}
                        disabled={voted}
                        onClick={() => setSelectedSeat(String(num))}
                        class={`py-2 rounded-lg font-bold text-sm transition relative ${
                          voted 
                            ? 'bg-slate-700/50 text-slate-500 cursor-not-allowed line-through' 
                            : isSelected 
                            ? 'bg-blue-600 text-white ring-2 ring-blue-400 shadow-lg scale-105' 
                            : 'bg-slate-700 text-slate-200 hover:bg-slate-600'
                        }`}>
                        {num}號
                        {voted && <span class="block text-[9px] text-red-400 no-underline">已投</span>}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 已選前三名卡片 */}
              <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                  <h2 class="text-lg font-bold text-slate-200">
                    我的心目中前三名：<span class="text-blue-400">{selectedSeat ? `${selectedSeat} 號` : '未選擇座號'}</span>
                  </h2>
                  <button 
                    onClick={handleSubmitVote}
                    class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition">
                    確認送出投票
                  </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {['first', 'second', 'third'].map((rank, idx) => {
                    const label = idx === 0 ? '🥇 第一名 (3分)' : idx === 1 ? '🥈 第二名 (2分)' : '🥉 第三名 (1分)';
                    const candidateId = rankings[rank];
                    const item = candidates.find(c => c.id === candidateId);
                    return (
                      <div key={rank} class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                        <div class="text-sm font-bold text-slate-400 mb-2">{label}</div>
                        {item ? (
                          <div class="space-y-2">
                            <img src={item.imageUrl} class="w-full h-32 object-cover rounded-lg" />
                            <div class="font-bold text-white">{item.title}</div>
                            <button onClick={() => assignRank(item.id, rank)} class="text-xs text-red-400 hover:underline">取消移除</button>
                          </div>
                        ) : (
                          <div class="h-32 border-2 border-dashed border-slate-700 rounded-lg flex items-center justify-center text-slate-500 text-sm">
                            請在下方點選指派
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 候選清單選單 */}
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {candidates.map(item => (
                  <div key={item.id} class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 flex flex-col justify-between">
                    <img src={item.imageUrl} class="w-full h-44 object-cover" />
                    <div class="p-4">
                      <h3 class="font-bold text-white text-lg">{item.title}</h3>
                      <p class="text-slate-400 text-xs mt-1 line-clamp-2">{item.desc}</p>
                    </div>
                    <div class="p-4 pt-0 grid grid-cols-3 gap-2">
                      <button 
                        onClick={() => assignRank(item.id, 'first')}
                        class={`py-1.5 rounded text-xs font-bold ${rankings.first === item.id ? 'bg-amber-500 text-white' : 'bg-slate-700 text-amber-300 hover:bg-slate-600'}`}>
                        🥇 1st
                      </button>
                      <button 
                        onClick={() => assignRank(item.id, 'second')}
                        class={`py-1.5 rounded text-xs font-bold ${rankings.second === item.id ? 'bg-slate-400 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                        🥈 2nd
                      </button>
                      <button 
                        onClick={() => assignRank(item.id, 'third')}
                        class={`py-1.5 rounded text-xs font-bold ${rankings.third === item.id ? 'bg-amber-700 text-white' : 'bg-slate-700 text-amber-500 hover:bg-slate-600'}`}>
                        🥉 3rd
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 排行榜頁面 */}
          {activeTab === 'leaderboard' && (
            <div class="space-y-6">
              {/* 頒獎台前三名 */}
              <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-center font-bold text-xl text-slate-200 mb-6">🏆 當前即時總得分領先榜</h2>
                <div class="flex justify-center items-end gap-4 h-64">
                  {/* 第二名 */}
                  {sortedLeaderboard[1] && (
                    <div class="w-1/3 flex flex-col items-center">
                      <img src={sortedLeaderboard[1].imageUrl} class="w-16 h-16 rounded-full object-cover border-2 border-slate-400 mb-2 shadow-md" />
                      <div class="text-xs font-bold text-slate-300">{sortedLeaderboard[1].title}</div>
                      <div class="text-xs text-slate-400 mb-1">{sortedLeaderboard[1].points} 分</div>
                      <div class="w-full bg-slate-700 h-32 rounded-t-lg flex items-center justify-center font-extrabold text-2xl text-slate-300">2</div>
                    </div>
                  )}
                  {/* 第一名 */}
                  {sortedLeaderboard[0] && (
                    <div class="w-1/3 flex flex-col items-center">
                      <img src={sortedLeaderboard[0].imageUrl} class="w-20 h-20 rounded-full object-cover border-4 border-amber-400 mb-2 shadow-xl" />
                      <div class="text-sm font-extrabold text-amber-400">{sortedLeaderboard[0].title}</div>
                      <div class="text-xs text-amber-200 mb-1 font-bold">{sortedLeaderboard[0].points} 分</div>
                      <div class="w-full bg-amber-500/80 h-44 rounded-t-lg flex items-center justify-center font-extrabold text-4xl text-white">1</div>
                    </div>
                  )}
                  {/* 第三名 */}
                  {sortedLeaderboard[2] && (
                    <div class="w-1/3 flex flex-col items-center">
                      <img src={sortedLeaderboard[2].imageUrl} class="w-16 h-16 rounded-full object-cover border-2 border-amber-700 mb-2 shadow-md" />
                      <div class="text-xs font-bold text-amber-600">{sortedLeaderboard[2].title}</div>
                      <div class="text-xs text-slate-400 mb-1">{sortedLeaderboard[2].points} 分</div>
                      <div class="w-full bg-amber-900/60 h-24 rounded-t-lg flex items-center justify-center font-extrabold text-xl text-amber-500">3</div>
                    </div>
                  )}
                </div>
              </div>

              {/* 完整得分長條圖清單 */}
              <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-3">
                {sortedLeaderboard.map((item, idx) => (
                  <div key={item.id} class="flex items-center gap-4 p-3 bg-slate-900/50 rounded-xl">
                    <span class="w-6 font-bold text-slate-400 text-center">{idx + 1}</span>
                    <img src={item.imageUrl} class="w-12 h-12 rounded-lg object-cover" />
                    <div class="flex-1">
                      <div class="flex justify-between font-bold text-slate-200 text-sm">
                        <span>{item.title}</span>
                        <span class="text-emerald-400">{item.points} 分</span>
                      </div>
                      <div class="text-[11px] text-slate-400 mt-1">
                        🥇{item['1st']}次 ‧ 🥈{item['2nd']}次 ‧ 🥉{item['3rd']}次
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 管理頁面 */}
          {activeTab === 'admin' && (
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-6">
              {!isAdminUnlocked ? (
                <div class="max-w-md mx-auto py-8 text-center space-y-4">
                  <h3 class="text-lg font-bold text-slate-200">🔒 請輸入管理員密碼解鎖</h3>
                  <input 
                    type="password" 
                    placeholder="密碼：aa710119"
                    value={adminPasswordInput}
                    onChange={e => setAdminPasswordInput(e.target.value)}
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-center focus:outline-none focus:border-purple-500"
                  />
                  <button onClick={handleAdminLogin} class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl">
                    驗證解鎖
                  </button>
                </div>
              ) : (
                <div class="space-y-6">
                  <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                    <h3 class="font-bold text-lg text-emerald-400">🔓 管理權限已解鎖</h3>
                    <div class="flex gap-2">
                      <button onClick={generate1To21} class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-sm">
                        ⚡ 一鍵生成 1~21 號候選項目
                      </button>
                      <button onClick={handleClearVotes} class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-xl text-sm">
                        🗑️ 清空全班雲端投票數據
                      </button>
                    </div>
                  </div>

                  {/* 自訂新增項目 */}
                  <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-3">
                    <h4 class="font-bold text-slate-300">手動新增候選項目</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <input 
                        placeholder="項目標題 (例: 項目 A)" 
                        value={newTitle} 
                        onChange={e=>setNewTitle(e.target.value)}
                        class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white" 
                      />
                      <input 
                        placeholder="圖片網址 (可選)" 
                        value={newImgUrl} 
                        onChange={e=>setNewImgUrl(e.target.value)}
                        class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white" 
                      />
                      <input 
                        placeholder="項目簡介 (可選)" 
                        value={newDesc} 
                        onChange={e=>setNewDesc(e.target.value)}
                        class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white" 
                      />
                    </div>
                    <button onClick={handleAddCandidate} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-xs">
                      + 新增項目
                    </button>
                  </div>

                  {/* 候選管理清單 */}
                  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {candidates.map(c => (
                      <div key={c.id} class="p-3 bg-slate-900 rounded-xl border border-slate-700 flex justify-between items-center">
                        <div class="truncate">
                          <div class="font-bold text-slate-200 text-sm truncate">{c.title}</div>
                          <div class="text-xs text-slate-500">ID: {c.id}</div>
                        </div>
                        <button onClick={() => handleDeleteCandidate(c.id)} class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1">
                          刪除
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
